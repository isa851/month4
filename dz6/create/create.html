<!-- Валидация формы
    title ≥ 4 символов, description ≥ 10 символов;
    price — положительное число;
    image — валидный URL (простая проверка через try { new URL(image) }).
    Под каждым полем показывай текст ошибки (красным), если поле невалидно. -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style.css">
    <title>Create Item</title>
</head>

<body>

    <header class="header">
        <div class="container header-container">
            <h2 class="header-shop"><a href="../index.html">Shop</a></h2>
            <button class="header-button">
                <a href="../index.html">Назад</a>
            </button>
        </div>
    </header>


    <div class="container-2">
        <h2>Create Item</h2>

        <form id="create-item-form">
            <div class="forms">
                <label for="title">Title</label>
                <input type="text" id="title" name="title" placeholder="Enter title">
                <span id="title-error" class="error"></span>
            </div>

            <div class="forms">
                <label for="description">Description</label>
                <textarea id="description" name="description" placeholder="Enter description"></textarea>
                <span id="description-error" class="error"></span>
            </div>

            <div class="forms">
                <label for="price">Price</label>
                <input type="text" id="price" name="price" placeholder="Enter price">
                <span id="price-error" class="error"></span>
            </div>

            <div class="forms">
                <label for="image">Image (URL)</label>
                <input type="url" id="image" name="image" placeholder="https://example.com/image.jpg">
                <span id="image-error" class="error"></span>
            </div>

            <button class="btn-create" type="submit">Create</button>
        </form>
    </div>

    <script src="./create.js"></script>
</body>

</html>
